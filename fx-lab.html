<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>FX lab — Pixel Cascade</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #12082a;
        font-family: ui-monospace, Menlo, monospace;
        color: #cfc4ff;
      }
      #stage {
        position: absolute;
        inset: 0;
      }
      #bar {
        position: fixed;
        top: 8px;
        left: 8px;
        display: flex;
        gap: 6px;
        z-index: 5;
      }
      button {
        font: inherit;
        font-size: 12px;
        padding: 5px 9px;
        background: #241a52;
        color: #cfc4ff;
        border: 1px solid #4a3788;
        border-radius: 7px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="bar"></div>
    <div id="stage"></div>
    <script type="module" src="/src/dev/fx-lab.ts"></script>
  </body>
</html>
